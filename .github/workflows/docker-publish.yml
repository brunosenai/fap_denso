name: Build and Publish Docker Image

on:
  workflow_dispatch: # Permite rodar apenas manualmente no painel do GitHub

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # A tag será gerada usando o seu usuário do Docker Hub + /fap-app:latest
          tags: ${{ secrets.DOCKER_USERNAME }}/fap-app:latest
          build-args: |
            NEXT_PUBLIC_API_KEY=re_9DKiyDmV_DYNWWFM7xaurNsXFwG2vEaTu
