name: fap_denso
services:
  db:
    image: mysql:8.0
    container_name: mysql_fap_denso
    restart: always
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: densosenaicentro402026_root
      MYSQL_DATABASE: fap_denso
      MYSQL_USER: fab_user
      MYSQL_PASSWORD: densosenaicentro402026
    volumes:
      - db_data:/var/lib/mysql
      - ./fap.sql:/docker-entrypoint-initdb.d/init.sql

  adminer:
    image: adminer
    container_name: adminer_fap_denso
    restart: always
    ports:
      - "8082:8080"
    depends_on:
      - db
  
  app:
    image: desenvolvimentocentro40/fap-denso-app:latest
    build: .
    container_name: fap_denso
    restart: always
    ports:
      - "3002:3000"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_USER=fab_user
      - DB_PASS=densosenaicentro402026
      - DB_NAME=fap_denso
      - API_KEY=re_9DKiyDmV_DYNWWFM7xaurNsXFwG2vEaTu
      - JWT_SECRET=re_9DKiyDmV_DYNWWFM7xaurNsXFwG2vEaTu
      - NEXT_PUBLIC_API_URL=http://76.13.230.207:3002/api
      - NEXT_PUBLIC_API_KEY=re_9DKiyDmV_DYNWWFM7xaurNsXFwG2vEaTu
      - MODO=2
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=brunopinhocampos@gmail.com
      - SMTP_PASS=krpgcixjmfmpldcx # <-- Senha nova, sem espaços!
      - EMAIL_DESTINO_EMPRESA=bpinho@fiemg.com.br
    volumes:
      - relatorios_data:/app/public/relatorios

volumes:
  db_data:
  relatorios_data: